annotation.processing.enabled=true
annotation.processing.enabled.in.editor=false
annotation.processing.processors.list=
annotation.processing.run.all.processors=true
annotation.processing.source.output=${build.generated.sources.dir}/ap-source-output
application.title=NominaGuate
application.vendor=NominaGuate
build.classes.dir=${build.dir}/classes
build.classes.excludes=**/*.java,**/*.form
build.dir=build
build.generated.dir=${build.dir}/generated
build.generated.sources.dir=${build.dir}/generated-sources
build.test.classes.dir=${build.dir}/test/classes
build.test.results.dir=${build.dir}/test/results
debug.classpath=${run.classpath}
debug.test.classpath=${run.test.classpath}
dist.dir=dist
dist.jar=${dist.dir}/NominaGuate.jar
dist.javadoc.dir=${dist.dir}/javadoc
endorsed.classpath=
excludes=
includes=**
jar.compress=false

# Jars en la carpeta libs/ del proyecto (JavaFX SDK + conector MySQL).
# Copia ahi los 4 jars de tu carpeta openjfx-21.0.11_windows-x64_bin-sdk/javafx-sdk-21.0.11/lib
# y el mysql-connector-j-x.x.x.jar que descargues.
javac.classpath=\
    libs/javafx.base.jar:\
    libs/javafx.controls.jar:\
    libs/javafx.fxml.jar:\
    libs/javafx.graphics.jar:\
    libs/mysql-connector-j.jar
javac.deprecation=false
javac.external.vm=false
javac.processorpath=${javac.classpath}
javac.source=21
javac.target=21
javac.test.classpath=\
    ${javac.classpath}:\
    ${build.classes.dir}
javac.test.processorpath=${javac.test.classpath}
javadoc.additionalparam=
javadoc.author=false
javadoc.encoding=${source.encoding}
javadoc.noindex=false
javadoc.nonavbar=false
javadoc.notree=false
javadoc.private=false
javadoc.splitindex=true
javadoc.use=true
javadoc.version=false
javadoc.windowtitle=
main.class=com.nominaguate.MainApp
manifest.file=manifest.mf
meta.inf.dir=${src.dir}/../resources/META-INF
mkdist.disabled=false
platform.active=default_platform

# Necesario para que la JVM encuentre los modulos de JavaFX en tiempo de ejecucion
run.jvmargs=--module-path "libs" --add-modules javafx.controls,javafx.fxml

run.classpath=\
    ${javac.classpath}:\
    ${build.classes.dir}
run.test.classpath=\
    ${javac.test.classpath}:\
    ${build.test.classes.dir}
source.encoding=UTF-8
src.dir=src/main/java
test.src.dir=test
